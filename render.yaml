# CampusFlow — Render Free-tier Blueprint (₹0)
# Public Node API only. PostgreSQL is Supabase (not Render).
# Redis is omitted (in-memory fallback). Python OR-Tools is omitted on Render Free.

services:
  - type: web
    name: campusflow-api
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build --workspace=apps/api
    startCommand: npx prisma migrate deploy --schema=./prisma/schema.prisma && node apps/api/dist/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://bmsce-smart-academic.vercel.app
      - key: ALLOW_DEMO_AUTH
        value: "true"
      - key: IS_DEMO_ENV
        value: "true"
      - key: INITIAL_DATA_MODE
        value: SYNTHETIC
      - key: DEMO_PASSWORD_HASH
        sync: false
